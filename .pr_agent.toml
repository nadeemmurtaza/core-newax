# Qodo (PR-Agent) Open Source Configuration for core-newax
# Reference: https://docs.qodo.ai/configuration

[config]
model = "gpt-4o"
fallback_models = ["gpt-4o-mini"]
git_provider = "github"
publish_output = true
auto_review = true
ignore_pr_title = ["^\\[wip\\]", "^draft:"]
ignore_pr_labels = ["skip-review", "automated-pr"]
ignore_bot_pr = true

[github_app]
pr_commands = [
    "/agentic_describe",
    "/agentic_review"
]
handle_push_trigger = true
push_commands = [
    "/agentic_review"
]
feedback_on_draft_pr = false

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 2
comments_routing_preset = "both"

enable_incremental_review = true
persistent_comment_notification = true
publish_in_progress_comment = true

enable_commitable_suggestions = true
enable_review_md = true
override_effort = "standard"

issues_user_guidelines = """
1. 29-Module Architecture: Ensure changes respect bounded contexts across core-newax modules.
2. Tenant & Organization Isolation: Validate that tenantId and organizationId are strictly enforced on all queries and mutations.
3. Cryptographic Mesh: Ensure all ecosystem communications adhere to dual-key isolation (K_sender != K_receiver) via NeuraCore Relay.
4. Framework API Integrity: Ensure NestJS modules use proper dependency injection, type hints, DTO validation, and error guards.
"""

compliance_user_guidelines = """
1. No direct cross-repository HTTP coupling: all inter-module calls must route through the Module Gateway or Event Bus.
2. Zero tolerance for PHP: Ensure 0.0% PHP in the codebase.
3. Clean error handling: Never leak stack traces or internal secrets in responses or logs.
"""

[review_agent_ux]
finding_overflow_count = 3
use_images_and_animations = true
show_context_used = true
show_persistent_review_section = true
show_daily_tips = false
show_dividers = true
show_comment_footer = true
severity_terminology = "high_medium_low"
findings_label_coloring = "simplified"
show_resolved_findings = true
resolved_findings_placement = "in_place"

expand_description = true
expand_code = true
expand_recommendation = true
expand_evidence = false

[qodo_describe_agent]
publish_mode = "dynamic"
publish_review_time_estimate_labels = true

[pr_code_suggestions]
num_code_suggestions = 4
rank_suggestions = true
enable_chat_in_code_suggestions = true

[chat_agent]
enabled = true
enable_fixer_agent = true

[fixer_agent]
enable = true
enable_auto_fix = false
action_level_threshold = 2
open_new_pr = false

[checks]
enable_auto_checks_feedback = true
persistent_comment = true
