name: PR 227 ESLint fixer

on:
  push:
    branches:
      - automation/pr227-eslint-fix

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unused schema-path constant
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tooling/planning-mistake-detector.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const unused = "const SCHEMA_PATH_PATTERN =\n  /(?:^|\\/)(?:schema\\.prisma|schema\\.(?:sql|ts|json)|models?\\.(?:ts|js))$/i;\n";
          if (!source.includes(unused)) {
            throw new Error('Expected unused SCHEMA_PATH_PATTERN declaration was not found.');
          }
          fs.writeFileSync(path, source.replace(unused, ''));
          NODE

      - name: Apply repository ESLint fixes
        run: |
          pnpm exec eslint --fix \
            tooling/planning-history-github.mjs \
            tooling/planning-history-github.test.mjs \
            tooling/planning-mistake-analysis.mjs \
            tooling/planning-mistake-detector.mjs

      - name: Reapply repository formatting
        run: |
          pnpm exec prettier --write \
            tooling/planning-history-github.mjs \
            tooling/planning-history-github.test.mjs \
            tooling/planning-mistake-analysis.mjs \
            tooling/planning-mistake-detector.mjs

      - name: Verify focused lint
        run: |
          pnpm exec eslint \
            tooling/planning-history-github.mjs \
            tooling/planning-history-github.test.mjs \
            tooling/planning-mistake-analysis.mjs \
            tooling/planning-mistake-detector.mjs \
            tooling/verify-pr-planning.mjs

      - name: Preserve corrected blobs
        run: |
          rm .github/workflows/pr227-eslint-fix.yml
          git config user.name 'NEWAX Engineering Automation'
          git config user.email 'engineering@newax.co'
          git add \
            tooling/planning-history-github.mjs \
            tooling/planning-history-github.test.mjs \
            tooling/planning-mistake-analysis.mjs \
            tooling/planning-mistake-detector.mjs \
            .github/workflows/pr227-eslint-fix.yml
          git commit -m 'Apply exact ESLint fixes to PR 227 source'
          git push origin HEAD:${GITHUB_REF_NAME}
