name: Snyk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for SNYK_TOKEN
        id: token-check
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN is not configured. Add a Snyk API token under Settings > Secrets and variables > Actions to enable this scan. Sign up at https://snyk.io and generate a token from Account Settings > API Token."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.token-check.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.token-check.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        if: steps.token-check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        if: steps.token-check.outputs.configured == 'true'
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --all-projects

      - name: Upload SARIF results
        if: steps.token-check.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
