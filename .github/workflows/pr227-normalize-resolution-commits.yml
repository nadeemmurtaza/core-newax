name: PR 227 resolution commit normalizer

on:
  push:
    branches:
      - automation/pr227-normalize-resolution-commits

permissions:
  contents: write
  issues: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize final resolution commit fields
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_PR_HEAD: 7dac7cadedbc2a4cf6dcbe8133cc30df9b7d46b9
        run: |
          node <<'NODE'
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const currentHead = process.env.CURRENT_PR_HEAD;
          const currentHeadIssues = [228, 262, 265, 1009, 1010, 1011, 1012, 1013];
          const dependencyIssue = 1017;

          async function request(path, options = {}) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers ?? {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${options.method ?? 'GET'} ${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.json();
          }

          async function replaceFixCommit(issueNumber, replacement) {
            const issue = await request(`/issues/${issueNumber}`);
            const body = String(issue.body ?? '');
            const matches = body.match(/^- Fix commit:.*$/gm) ?? [];
            if (matches.length !== 1) {
              throw new Error(`Issue #${issueNumber} must contain exactly one Fix commit field; found ${matches.length}.`);
            }
            const updatedBody = body.replace(/^- Fix commit:.*$/m, `- Fix commit: \`${replacement}\``);
            await request(`/issues/${issueNumber}`, {
              method: 'PATCH',
              body: JSON.stringify({ body: updatedBody }),
              headers: { 'Content-Type': 'application/json' },
            });
            console.log(`Normalized issue #${issueNumber}`);
          }

          for (const issueNumber of currentHeadIssues) {
            await replaceFixCommit(issueNumber, currentHead);
          }
          await replaceFixCommit(
            dependencyIssue,
            'not-applicable: trusted base dependency correction at bd1c62af8b43cd29f5fd948ef340086b7ce36261',
          );
          NODE

      - name: Remove helper workflow
        run: |
          rm .github/workflows/pr227-normalize-resolution-commits.yml
          git config user.name 'NEWAX Engineering Automation'
          git config user.email 'engineering@newax.co'
          git add .github/workflows/pr227-normalize-resolution-commits.yml
          git commit -m 'Remove PR 227 resolution normalizer'
          git push origin HEAD:${GITHUB_REF_NAME}
