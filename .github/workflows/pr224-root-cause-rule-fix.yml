name: PR 224 root-cause rule fix

on:
  push:
    branches:
      - automation/pr224-root-cause-rule-fix

permissions:
  contents: write

jobs:
  fix-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace legacy learning-outcome verification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tooling/verify-root-cause-governance.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const oldCoreImport = `  loadCatalog,\n  parseMetadata,\n  parsePullRequestField,\n} from './engineering-learning-core.mjs';`;
          const newCoreImport = `  loadCatalog,\n  parseMetadata,\n} from './engineering-learning-core.mjs';`;
          if (!source.includes(oldCoreImport)) {
            throw new Error('Expected engineering-learning-core import was not found.');
          }
          source = source.replace(oldCoreImport, newCoreImport);

          const oldEngineImport = `import {\n  evaluateLearningOutcome,\n  parseExplanationEvidenceRecord,\n  verifyExplanation,\n  verifyRootCauseExplanation,\n} from './root-cause-engine.mjs';`;
          const newEngineImport = `import { evaluateLearningRequirement } from './learning-outcome-rule-engine.mjs';\nimport {\n  parseExplanationEvidenceRecord,\n  verifyExplanation,\n  verifyRootCauseExplanation,\n} from './root-cause-engine.mjs';`;
          if (!source.includes(oldEngineImport)) {
            throw new Error('Expected root-cause-engine import was not found.');
          }
          source = source.replace(oldEngineImport, newEngineImport);

          const oldInputs = `const [issues, commits] = await Promise.all([\n  listAll('/issues?state=all'),\n  listAll(\`/pulls/\${pullRequest.number}/commits\`),\n]);`;
          const newInputs = `const [issues, commits, changedFiles] = await Promise.all([\n  listAll('/issues?state=all'),\n  listAll(\`/pulls/\${pullRequest.number}/commits\`),\n  listAll(\`/pulls/\${pullRequest.number}/files\`),\n]);`;
          if (!source.includes(oldInputs)) {
            throw new Error('Expected governance input block was not found.');
          }
          source = source.replace(oldInputs, newInputs);

          const oldDecision = `const declaredOutcome = parsePullRequestField(pullRequest.body ?? '', '- Learning outcome:');\nconst outcomeDecision = evaluateLearningOutcome({\n  declaredOutcome,\n  failedRuns,\n  linkedIssues,\n});\nconst errors = [...outcomeDecision.errors];`;
          const newDecision = `const learningRequirement = evaluateLearningRequirement({\n  changedFiles,\n  failedWorkflowRuns: failedRuns,\n  linkedLearningIssues: linkedIssues,\n});\nconst errors = [];`;
          if (!source.includes(oldDecision)) {
            throw new Error('Expected legacy learning-outcome decision block was not found.');
          }
          source = source.replace(oldDecision, newDecision);

          const oldOutput = '    outcome: declaredOutcome,';
          const newOutput = '    outcome: learningRequirement.learningOutcome,';
          if (!source.includes(oldOutput)) {
            throw new Error('Expected legacy outcome output was not found.');
          }
          source = source.replace(oldOutput, newOutput);

          fs.writeFileSync(path, source);
          NODE

      - name: Format and lint governance verifier
        run: |
          pnpm exec prettier --write tooling/verify-root-cause-governance.mjs
          pnpm exec eslint tooling/verify-root-cause-governance.mjs

      - name: Run learning rule and root-cause tests
        run: |
          node --test \
            tooling/learning-outcome-rule-engine.test.mjs \
            tooling/root-cause-verification.test.mjs \
            tooling/explanation-verification.test.mjs

      - name: Preserve corrected verifier blob
        run: |
          rm .github/workflows/pr224-root-cause-rule-fix.yml
          git config user.name 'NEWAX Engineering Automation'
          git config user.email 'engineering@newax.co'
          git add tooling/verify-root-cause-governance.mjs .github/workflows/pr224-root-cause-rule-fix.yml
          git commit -m 'Use evidence-derived outcome in root-cause governance'
          git push origin HEAD:${GITHUB_REF_NAME}
